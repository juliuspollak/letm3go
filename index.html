<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16352f" />
    <title>Letm3go</title>
    <script>
      /* Pick the saved theme before the first paint, so a dark-mode user never sees a light flash. */
      try{if(localStorage.getItem('letm3go-theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}
    </script>
    <style>
      /* Launch splash. It paints before the 1 MB app bundle has downloaded and parsed, and the same
         classes are reused by src/components/LoadingScreen.jsx so the hand-over to React does not jump. */
      html{background:#f6f7fb}html[data-theme=dark]{background:#10131b}
      body{margin:0}
      .boot{--b-ink:#202638;--b-muted:#626d82;--b-accent:#4659d9;--b-track:#dfe4ee;margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;box-sizing:border-box;background:#f6f7fb;color:var(--b-ink);font-family:'DM Sans',-apple-system,system-ui,sans-serif;text-align:center}
      [data-theme=dark] .boot{--b-ink:#edf0f8;--b-muted:#a4aec2;--b-accent:#a6b4ff;--b-track:#30394b;background:#10131b}
      .boot-mark{position:relative;width:84px;height:84px;display:grid;place-items:center}
      .boot-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0,var(--b-accent) 70%,transparent 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));animation:boot-spin 1.1s linear infinite}
      .boot-ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:4px solid var(--b-track);opacity:.45;-webkit-mask:none;mask:none}
      .boot-glyph{width:34px;height:34px;color:var(--b-accent);animation:boot-pulse 2.2s ease-in-out infinite}
      .boot-word{font-size:30px;font-weight:800;letter-spacing:-1.5px;line-height:1}
      .boot-word b{color:var(--b-accent);font-weight:800}
      .boot-text{margin:0;font-size:13px;line-height:1.5;color:var(--b-muted);min-height:2.6em;max-width:280px}
      .boot-bar{width:132px;height:4px;border-radius:4px;overflow:hidden;background:var(--b-track)}
      .boot-bar::before{content:"";display:block;height:100%;width:40%;border-radius:4px;background:var(--b-accent);animation:boot-slide 1.3s cubic-bezier(.45,0,.25,1) infinite}
      .boot-top{position:fixed;z-index:2000;top:0;left:0;right:0;height:3px;overflow:hidden;pointer-events:none;opacity:0;animation:boot-fade-in .2s .5s forwards}
      .boot-top::before{content:"";display:block;height:100%;width:35%;background:var(--accent,#4659d9);animation:boot-slide 1.2s cubic-bezier(.45,0,.25,1) infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @keyframes boot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(.92)}}
      @keyframes boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
      @keyframes boot-fade-in{to{opacity:1}}
      @media(prefers-reduced-motion:reduce){.boot-ring{animation:none;background:none;border:4px solid var(--b-accent);-webkit-mask:none;mask:none}.boot-glyph,.boot-bar::before,.boot-top::before{animation:none}.boot-bar::before{width:100%;opacity:.5}}
    </style>
  </head>
  <body><div id="root"><main class="boot" role="status" aria-live="polite"><div class="boot-mark"><span class="boot-ring"></span><svg class="boot-glyph" viewBox="0 0 28 28" fill="none" aria-hidden="true"><path d="M5 22h3a8 8 0 0 0 8-8V6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="m10.5 11.5 5.5-5.5 5.5 5.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="boot-word">letm<b>3</b>go</span><div class="boot-bar" aria-hidden="true"></div><p class="boot-text">Starting…</p></main></div><script type="module" src="/src/main.jsx"></script></body>
</html>
