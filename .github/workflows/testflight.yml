name: Deploy Letm3go to TestFlight
run-name: 'TestFlight • ${{ github.ref_name }} • ${{ inputs.upload_approved && \'Build + upload\' || \'Build only\' }}'
on:
  workflow_dispatch:
    inputs:
      upload_approved:
        description: 'Upload signed build to TestFlight (untick for build-only)'
        type: boolean
        default: false
      build_number:
        description: 'Build number override (blank = latest TestFlight + 1)'
        type: string
      release_notes:
        description: 'What to Test notes for App Store Connect'
        type: string
permissions:
  contents: read
concurrency:
  group: letm3go-testflight
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: ios-signing
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Xcode and iPhoneOS SDK
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          sdk_major=${sdk_version%%.*}
          [[ "$sdk_major" -ge 26 ]] || { echo "::error::iPhoneOS SDK 26 or later required"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.7'
          bundler-cache: true
      - name: Validate release configuration
        run: |
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing required secret $name"; exit 1; fi
          done
      - run: npm ci
      - run: npm run release:check
      - run: npm run testflight:check
      - run: npm run check
      - run: npm run check:edge
      - run: npm run test:native
      - run: npm run ios:sync:production
      - name: Import and validate dedicated signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: bash scripts/ci-signing.sh
      - name: Package signed IPA (no upload)
        env:
          BUILD_NUMBER_OVERRIDE: ${{ inputs.build_number }}
        run: bundle exec fastlane ios package
      - uses: actions/upload-artifact@v4
        with:
          name: letm3go-ipa-${{ github.run_id }}
          path: |
            .build/release/Letm3go.ipa
            .build/release/build-number.txt
            .build/release/Letm3go.manifest.json
          retention-days: 7
      - name: Clean signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/letm3go-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/letm3go.p12" "$RUNNER_TEMP/letm3go.mobileprovision" "$RUNNER_TEMP/letm3go-profile.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
  upload:
    if: ${{ inputs.upload_approved }}
    needs: package
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1.7'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: letm3go-ipa-${{ github.run_id }}
          path: .build/release
      - name: Upload approved build only
        env:
          LETM3GO_UPLOAD_APPROVED: 'YES'
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: bundle exec fastlane ios upload
