name: Check

# Run checks on demand instead of billing private-repository minutes for every commit.
# TestFlight still runs its own comprehensive release verification.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: 'Which checks to run'
        required: true
        default: 'web'
        type: choice
        options:
          - web
          - ios
          - all

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  web:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.checks == 'web' || inputs.checks == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:edge
      - run: npm audit --audit-level=moderate

  ios:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'ios' || inputs.checks == 'all') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:native
      - run: npm run ios:sync
      - run: npm run ios:build
