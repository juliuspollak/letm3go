# Local settings only. CLI link is stored in ignored supabase/.temp/project-ref; this file does not configure hosted Auth.
project_id = "letm3go"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "au.jpollak.journey://auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false

[functions.health]
verify_jwt = true
entrypoint = "./functions/health/index.ts"

# Proposed public-read endpoint; POST operations validate the user JWT internally.
[functions.journeys]
verify_jwt = false
entrypoint = "./functions/journeys/index.ts"

[functions.account]
verify_jwt = false
entrypoint = "./functions/account/index.ts"

[functions.tesla]
verify_jwt = false
entrypoint = "./functions/tesla/index.ts"

# HMAC-authenticated trusted receiver consumer only; no browser ingestion.
[functions.telemetry-ingest]
verify_jwt = false
entrypoint = "./functions/telemetry-ingest/index.ts"

[functions.tesla-recording]
verify_jwt = false
entrypoint = "./functions/tesla-recording/index.ts"
